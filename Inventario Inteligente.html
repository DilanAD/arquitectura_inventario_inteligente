<style>
/* Concepto: consola de bodega. Navegación lateral fija, tablas densas y un mapa de calor como pieza central de la red de negocios. */
:root{
  --bg:#F2F5F9; --surface:#FFFFFF; --surface-2:#E8EDF4; --fg:#14213D; --muted:#56637D; --line:#D3DAE6;
  --accent:#0E5A66; --accent-ink:#FFFFFF; --accent-soft:#D8EBEE;
  --heat:#C2410C;
  --ok:#1E7A4F; --ok-soft:#DDF1E6; --warn:#8A5700; --warn-soft:#FBEBCB; --bad:#B3261E; --bad-soft:#F9DEDB;
  --f-display:'Bricolage Grotesque','IBM Plex Sans',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1526; --surface:#15203A; --surface-2:#1D2A48; --fg:#E7ECF6; --muted:#9AA8C4; --line:#2A3960;
    --accent:#5CC0CF; --accent-ink:#06242A; --accent-soft:#143841; --heat:#F0803C;
    --ok:#5FD393; --ok-soft:#133A28; --warn:#F0B44C; --warn-soft:#3D2C0B; --bad:#FF8F85; --bad-soft:#4A1C19;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1526; --surface:#15203A; --surface-2:#1D2A48; --fg:#E7ECF6; --muted:#9AA8C4; --line:#2A3960;
  --accent:#5CC0CF; --accent-ink:#06242A; --accent-soft:#143841; --heat:#F0803C;
  --ok:#5FD393; --ok-soft:#133A28; --warn:#F0B44C; --warn-soft:#3D2C0B; --bad:#FF8F85; --bad-soft:#4A1C19;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-body);padding-inline:0}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font:700 24px/1.15 var(--f-display);letter-spacing:-.01em}
h2{font:600 16px/1.3 var(--f-body)}
h3{font:600 13px/1.3 var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
p{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:8px 16px;background:var(--fg);color:var(--bg);font-size:12px}
.banner button{background:transparent;border:1px solid currentColor;border-radius:6px;padding:3px 10px;font-size:12px;color:inherit}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100vh - 36px)}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;align-self:start;min-height:calc(100vh - 36px)}
.brand{font:700 19px/1.1 var(--f-display);letter-spacing:-.01em;padding:0 6px}
.brand small{display:block;font:400 11px/1.4 var(--f-body);color:var(--muted);letter-spacing:0;margin-top:4px}
.nav{display:flex;flex-direction:column;gap:2px}
.nv{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--muted);font-weight:500}

.nv.on{background:var(--accent-soft);color:var(--accent)}
.userbox{margin-top:auto;border-top:1px solid var(--line);padding:12px 6px 0;display:grid;gap:3px;font-size:12px}
.userbox b{font-size:13px}
.main{padding:22px 24px 48px;min-width:0;max-width:1180px;width:100%}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.ph .sub{color:var(--muted);margin-top:4px;max-width:60ch}
.rfs{display:flex;gap:6px;flex-wrap:wrap}
.rf{font:500 11px var(--f-mono);border:1px solid var(--line);border-radius:5px;padding:2px 6px;color:var(--muted);background:var(--surface)}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.kpi .v{font:600 26px/1.15 var(--f-mono);font-variant-numeric:tabular-nums;margin-top:6px}
.kpi .n{font-size:12px;color:var(--muted);margin-top:2px}
.two{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:start}
.split{grid-template-columns:minmax(0,1fr) 340px;align-items:start}
.tw{overflow-x:auto;margin-inline:-4px;padding-inline:4px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font:500 11px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tbody tr[data-a]{cursor:pointer}
tbody tr[data-a]:hover td{background:var(--surface-2)}
tbody tr.sel td{background:var(--accent-soft)}
.pill{display:inline-flex;align-items:center;gap:5px;font:500 11px var(--f-body);padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-info{background:var(--accent-soft);color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.dng{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
label.f{display:grid;gap:5px;font-size:12px;font-weight:500;color:var(--muted)}
input,select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
input:focus,select:focus{border-color:var(--accent)}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 16px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:12px;font-weight:500;color:var(--muted)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.msg{border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.msg.bad{background:var(--bad-soft);color:var(--bad)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.msg ul{margin:0;padding-left:18px}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar.h>i{background:var(--heat)}
.al{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.al li{display:flex;gap:10px;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.al li b{font-weight:600}
.stack{display:grid;gap:14px}
.hero{display:grid;place-items:center;min-height:calc(100vh - 36px);padding:24px 16px}
.login{width:100%;max-width:760px;display:grid;gap:22px}
.login h1{font-size:34px}
.profiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.pf{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px;display:grid;gap:4px}
.pf.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.pf b{font-size:14px}
.pf span{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;max-width:min(92vw,520px);z-index:50}
.legend{height:10px;border-radius:5px;background:linear-gradient(90deg,color-mix(in srgb,var(--heat) 8%,var(--surface)),var(--heat));border:1px solid var(--line)}
.map text{font-family:var(--f-body)}
.map g[data-a]{cursor:pointer}
.map g[data-a]:focus-visible rect.cell{stroke:var(--fg);stroke-width:3}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right}
.chart text{font:11px var(--f-mono);fill:var(--muted)}
.ft{font-size:12px;color:var(--muted)}
@media (max-width:980px){.two,.split{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;min-height:0;flex-direction:column;gap:10px;padding:12px 16px;border-right:0;border-bottom:1px solid var(--line)}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:2px}
  .nv{white-space:nowrap;padding:8px 12px}
  .userbox{margin-top:0;border-top:0;padding:0;grid-template-columns:1fr auto;align-items:center}
  .main{padding:18px 16px 40px}
  h1{font-size:21px}
  .login h1{font-size:27px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

function submitMov(){
  var m=S.ui.mov,p=P(m.pid),qty=parseInt(m.qty,10),e=[];
  if(!(qty>0))e.push('Ingresa una cantidad entera mayor que cero.');
  if(m.tipo==='Entrada'&&!m.doc.trim())e.push('La entrada necesita un documento soporte (factura o remisión).');
  if(m.tipo==='Entrada'&&p.cat==='Lácteos'&&!m.vence)e.push('Este producto requiere fecha de vencimiento.');
  var sign=m.tipo==='Entrada'?1:m.tipo==='Salida'?-1:(m.motivo==='Devolución'?1:-1);
  if(qty>0&&sign<0&&qty>p.stock)e.push('Existencias insuficientes: quedan '+p.stock+' unidades de '+p.name+'.');
  if(e.length){S.ui.movErr=e;S.ui.movOk=null;renderMain();return;}
  var before=p.stock;p.stock+=sign*qty;
  S.kardex.push({t:new Date(),pid:p.id,tipo:m.tipo,qty:sign*qty,saldo:p.stock,user:who(),ref:m.tipo==='Ajuste'?m.motivo:(m.doc||'Venta mostrador')});
  var crossed=before>p.reorder&&p.stock<=p.reorder;
  S.ui.movErr=null;
  S.ui.movOk=m.tipo+' registrada: '+esc(p.name)+' '+(sign>0?'+':'−')+qty+'. Nuevo saldo: '+p.stock+'.'+(crossed?' Se generó una alerta de reabastecimiento y se notificó al administrador (simulado).':'');
  m.qty='';m.doc='';m.lote='';m.vence='';
  renderMain();
}

/* prediccion y compras */
function chartSvg(p){
  var s=series(p),pw=predWeek(p),proj=[1,2,3,4].map(function(k){return Math.round(pw*(1+0.015*k));});
  var all=s.concat(proj),mx=Math.ceil(Math.max.apply(null,all)*1.3/10)*10;
  var W=560,H=230,L=44,R=14,T=14,B=34;
  function x(i){return L+i*(W-L-R)/11;} function y(v){return T+(1-v/mx)*(H-T-B);}
  var act=s.map(function(v,i){return (i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1);}).join(' ');
  var pr='M'+x(7).toFixed(1)+' '+y(s[7]).toFixed(1)+proj.map(function(v,i){return ' L'+x(8+i).toFixed(1)+' '+y(v).toFixed(1);}).join('');
  var up=proj.map(function(v,i){return x(8+i).toFixed(1)+' '+y(v*1.14).toFixed(1);});
  var lo=proj.map(function(v,i){return x(8+i).toFixed(1)+' '+y(v*0.86).toFixed(1);}).reverse();
  var band='M'+x(7).toFixed(1)+' '+y(s[7]).toFixed(1)+' L'+up.join(' L')+' L'+lo.join(' L')+' Z';
  var grid=[0,mx/2,mx].map(function(v){return '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" style="stroke:var(--line);stroke-width:1"/><text x="'+(L-6)+'" y="'+(y(v)+4)+'" text-anchor="end">'+Math.round(v)+'</text>';}).join('');
  var labs='';for(var i=0;i<12;i++){labs+='<text x="'+x(i)+'" y="'+(H-12)+'" text-anchor="middle">'+(i<7?'S'+(i-7):i===7?'S0':'S+'+(i-7))+'</text>';}
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Ventas de las últimas 8 semanas y proyección de 4 semanas para '+esc(p.name)+'" style="width:100%;height:auto;max-width:100%">'+grid+
   '<path d="'+band+'" style="fill:var(--accent);opacity:.16"/><path d="'+act+'" fill="none" style="stroke:var(--fg);stroke-width:2"/>'+
   '<path d="'+pr+'" fill="none" style="stroke:var(--accent);stroke-width:2.2;stroke-dasharray:6 4"/>'+
   '<circle cx="'+x(7)+'" cy="'+y(s[7])+'" r="4" style="fill:var(--fg)"/><circle cx="'+x(11)+'" cy="'+y(proj[3])+'" r="4" style="fill:var(--accent)"/>'+
   '<text x="'+(x(11)-6)+'" y="'+(y(proj[3]*1.14)-8)+'" text-anchor="end" style="fill:var(--accent)">'+proj[3]+' u/sem</text>'+labs+'</svg>';
}

function mapaHtml(){

  var own=ownZone(),cat=S.ui.mcat,zs=S.ui.zone,locked=function(i){return S.role==='negocio'&&i!==own;};
  var cells=ZONES.map(function(z,i){
    var col=i%4,row=Math.floor(i/4),x=10+col*160,y=10+row*130,v=zInt(i,cat),low=z.c<K_MIN,lk=locked(i);
    var fill=lk?'fill:var(--surface-2)':low?'fill:url(#hatch)':'fill:color-mix(in srgb,var(--heat) '+Math.round(v*100)+'%,var(--surface))';
    var tc=(!lk&&!low&&v>0.68)?'fill:#fff':'fill:var(--fg)';
    var sub=lk?'Fuera de tu zona':low?'Menos de '+K_MIN+' negocios':z.c+' negocios · índice '+Math.round(v*100);
    var stroke=i===own?'stroke:var(--accent);stroke-width:3':i===zs?'stroke:var(--fg);stroke-width:2.5':'stroke:var(--line);stroke-width:1';
    return '<g data-a="zone" data-z="'+i+'" tabindex="0" role="button" aria-label="Zona '+z.n+': '+sub+'"><rect class="cell" x="'+x+'" y="'+y+'" width="150" height="118" rx="8" style="'+fill+';'+stroke+'"/>'+
     '<text x="'+(x+12)+'" y="'+(y+26)+'" style="'+tc+';font-size:14px;font-weight:600">'+z.n+'</text>'+
     (i===own?'<text x="'+(x+12)+'" y="'+(y+44)+'" style="'+tc+';font-size:11px">Tu zona</text>':'')+
     '<text x="'+(x+12)+'" y="'+(y+104)+'" style="'+tc+';font-size:11px">'+sub+'</text></g>';
  }).join('');
  var svg='<svg class="map" viewBox="0 0 650 400" role="group" aria-label="Mapa de zonas" style="width:100%;height:auto;max-width:100%"><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" style="fill:var(--surface-2)"/><line x1="0" y1="0" x2="0" y2="8" style="stroke:var(--line);stroke-width:3"/></pattern></defs>'+cells+'</svg>';
  var catSel='<label class="f" for="mcat">Categoría<select id="mcat" data-i="mcat">'+['Todas'].concat(CATS).map(function(c){return '<option'+(c===cat?' selected':'')+'>'+c+'</option>';}).join('')+'</select></label>';
  var perSel='<label class="f" for="per">Periodo<select id="per" data-i="period"><option value="30"'+(S.ui.period==='30'?' selected':'')+'>Últimos 30 días</option><option value="90"'+(S.ui.period==='90'?' selected':'')+'>Últimos 90 días</option></select></label>';
  return '<div class="grid split"><section class="card stack"><div class="fg" style="grid-template-columns:repeat(auto-fit,minmax(160px,220px))">'+catSel+perSel+'</div>'+svg+
   '<div><div class="legend"></div><div class="row sp ft" style="margin-top:4px"><span>Menos ventas</span><span>Más ventas (índice 0 a 100)</span></div></div>'+
   '<p class="ft">Las zonas rayadas tienen menos de '+K_MIN+' negocios y no se muestran, para que ningún negocio pueda identificarse.</p></section>'+zoneDetail()+'</div>';
}
function zoneDetail(){
  var i=S.ui.zone,z=ZONES[i],cat=S.ui.mcat,own=ownZone();
  if(S.role==='negocio'&&i!==own)i=own,z=ZONES[own];
  if(z.c<K_MIN)return '<aside class="card stack"><h2>Zona '+z.n+'</h2><div class="msg bad">Datos insuficientes. Hacen falta al menos '+K_MIN+' negocios para proteger la privacidad de quienes aportan.</div></aside>';
  var shares=CATS.map(function(c){return {c:c,v:zInt(i,c)};}),sum=shares.reduce(function(s,x){return s+x.v;},0);
  shares.sort(function(a,b){return b.v-a.v;});
  var ci=Math.max(0,CATS.indexOf(cat)),zoneAvg=Math.round(40+zInt(i,cat)*160),mine=Math.round(zoneAvg*(0.8+hv(1,ci+3)*0.5)),diff=Math.round((mine/zoneAvg-1)*100);
  var cmp=i===own?'<h3>Tu negocio frente a la zona</h3><div class="stack" style="gap:8px"><div class="row sp"><span>Promedio de la zona</span><b class="mono">'+zoneAvg+' u/sem</b></div><div class="bar"><i style="width:'+Math.min(100,zoneAvg/Math.max(zoneAvg,mine)*100)+'%;background:var(--muted)"></i></div><div class="row sp"><span>Tu negocio</span><b class="mono">'+mine+' u/sem</b></div><div class="bar"><i style="width:'+Math.min(100,mine/Math.max(zoneAvg,mine)*100)+'%"></i></div><p class="'+(diff>=0?'':'muted')+'">'+(diff>=0?'Vendes '+diff+' % más':'Vendes '+Math.abs(diff)+' % menos')+' que el promedio de la zona en '+(cat==='Todas'?'todas las categorías':cat.toLowerCase())+'.</p></div>':'';
  var opp=i===own?'<div class="msg" style="background:var(--warn-soft);color:var(--warn)"><b>Oportunidad</b><br>La demanda de bebidas energizantes subió 34 % frente al mes anterior en tu zona y no está en tu catálogo.<div style="margin-top:8px"><button class="btn sm" data-a="addcat">Agregar al catálogo</button></div></div>':'';
  return '<aside class="card stack"><div><h2>Zona '+z.n+'</h2><span class="muted">'+z.c+' negocios aportan datos</span></div>'+cmp+
   '<h3>Categorías más vendidas</h3><div class="stack" style="gap:8px">'+shares.map(function(x){var pc=Math.round(x.v/sum*100);return '<div><div class="row sp"><span>'+x.c+'</span><span class="mono muted">'+pc+' %</span></div><div class="bar h"><i style="width:'+Math.min(100,pc*3)+'%"></i></div></div>';}).join('')+'</div>'+opp+
   '<div class="row"><button class="btn sm" data-a="exp">Exportar PDF</button><button class="btn sm" data-a="exp">Exportar imagen</button></div></aside>';
}
function partHtml(){
  var c=S.net.consent;
  var conf=S.net.confirm?'<div class="msg bad" role="alertdialog"><b>¿Revocar la participación?</b><br>Dejarás de enviar datos y de ver mapas de calor. Tus datos agregados ya incluidos seguirán anónimos.<div class="row" style="margin-top:10px"><button class="btn dng sm" data-a="revyes">Sí, revocar</button><button class="btn sm" data-a="revno">Cancelar</button></div></div>':'';
  return '<section class="card stack" style="max-width:640px"><div class="row sp"><h2>Participación en la red</h2><span class="pill '+(c?'p-ok':'p-warn')+'">'+(c?'Activa':'Revocada')+'</span></div>'+
   '<dl class="kv"><dt>Acuerdo de participación</dt><dd>Versión 1.2</dd><dt>Consentimiento</dt><dd>'+(c?'Aceptado el 12 sep 2026':'Revocado')+'</dd><dt>Último envío</dt><dd>'+(c?'Hoy, 2:10 · 1.284 registros':'Sin envíos')+'</dd><dt>Registros rechazados</dt><dd>'+(c?'3 duplicados':'0')+'</dd><dt>Zona</dt><dd>Centro</dd></dl>'+
   '<p class="muted">Tus ventas se agregan por zona antes de llegar a otros negocios. Nadie ve cifras individuales.</p>'+conf+
   (c?(S.net.confirm?'':'<div><button class="btn dng" data-a="revask">Revocar participación</button></div>'):'<div><button class="btn pri" data-a="rejoin">Volver a participar</button></div>')+'</section>';
}
function negHtml(){
  var rows=S.negocios.map(function(n){
    var st=n.state==='Pendiente'?'<span class="pill p-warn">Pendiente</span>':n.state==='Suspendido'?'<span class="pill p-bad">Suspendido</span>':n.days>7?'<span class="pill p-bad">Sin datos hace '+n.days+' días</span>':'<span class="pill p-ok">Activo</span>';
    var act=n.state==='Pendiente'?'<button class="btn sm pri" data-a="napr" data-id="'+n.id+'">Aprobar</button> <button class="btn sm" data-a="nrej" data-id="'+n.id+'">Rechazar</button>':n.id===1?'':n.state==='Suspendido'?'<button class="btn sm" data-a="nsus" data-id="'+n.id+'">Reactivar</button>':'<button class="btn sm" data-a="nsus" data-id="'+n.id+'">Suspender</button>';
    return '<tr><td>'+esc(n.name)+'</td><td>'+n.zone+'</td><td>'+n.sector+'</td><td>'+st+'</td><td>'+act+'</td></tr>';
  }).join('');
  return '<section class="card stack"><div class="row sp"><h2>Negocios asociados</h2><span class="ft">Se avisa al administrador cuando un negocio pasa 7 días sin enviar datos.</span></div><div class="tw"><table><thead><tr><th>Negocio</th><th>Zona</th><th>Sector</th><th>Estado</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div></section>';
}

/* reportes */
function pRep(){
  var rows=S.products.map(function(p){var v=series(p).slice(4).reduce(function(a,b){return a+b;},0);return {p:p,v:v,r:v/p.stock};}).sort(function(a,b){return b.r-a.r;});
  var mx=rows[0].r,valor=S.products.reduce(function(s,p){return s+p.stock*p.cost;},0);
  return head('Reportes','Rotación, valor del inventario y pérdidas del periodo.',['RF-12','RF-28'])+
   '<div class="grid kpis"><div class="card kpi"><h3>Valor del inventario</h3><div class="v">'+COP.format(valor)+'</div></div><div class="card kpi"><h3>Pérdidas por ajustes (mes)</h3><div class="v">'+COP.format(184500)+'</div><div class="n">Avería y obsolescencia</div></div></div>'+
   '<section class="card stack"><div class="row sp"><h2>Rotación últimos 30 días</h2><div class="row"><button class="btn sm" data-a="exp">Exportar Excel</button><button class="btn sm" data-a="exp">Exportar PDF</button></div></div>'+
   '<div class="stack" style="gap:10px">'+rows.map(function(x){return '<div style="display:grid;grid-template-columns:minmax(120px,200px) 1fr 70px;gap:10px;align-items:center"><span>'+esc(x.p.name)+'</span><div class="bar"><i style="width:'+(x.r/mx*100)+'%"></i></div><span class="mono r" style="text-align:right">'+x.r.toFixed(1).replace('.',',')+' ×</span></div>';}).join('')+'</div>'+
   '<p class="ft">Rotación = unidades vendidas en 30 días ÷ stock actual. Valores bajos indican capital inmovilizado.</p></section>';
}

/* usuarios */
function pUsr(){
  var rows=S.users.map(function(u){return '<tr><td>'+esc(u.name)+'<br><span class="muted">'+esc(u.mail)+'</span></td><td style="width:170px"><select data-i="urol" data-id="'+u.id+'" aria-label="Rol de '+esc(u.name)+'"><option'+(u.rol==='Administrador'?' selected':'')+'>Administrador</option><option'+(u.rol==='Operario'?' selected':'')+'>Operario</option></select></td><td><button class="btn sm" data-a="utog" data-id="'+u.id+'">'+(u.on?'Desactivar':'Activar')+'</button> <span class="pill '+(u.on?'p-ok':'p-warn')+'">'+(u.on?'Activo':'Inactivo')+'</span></td></tr>';}).join('');
  var form=S.ui.newUser?'<form class="card stack" data-f="user"><h2>Nuevo usuario</h2><div class="fg"><label class="f" for="un">Nombre<input id="un" required></label><label class="f" for="um">Correo<input id="um" type="email" required></label><label class="f" for="ur">Rol<select id="ur"><option>Operario</option><option>Administrador</option></select></label></div><div class="row"><button class="btn pri" type="submit">Crear usuario</button><button type="button" class="btn" data-a="unew">Cancelar</button></div></form>':'';
  return head('Usuarios y roles','Los operarios no pueden cambiar precios ni borrar registros.',['RF-11'])+
   '<section class="card stack"><div class="row sp"><h2>Equipo</h2><button class="btn pri sm" data-a="unew">Nuevo usuario</button></div><div class="tw"><table><thead><tr><th>Usuario</th><th>Rol</th><th>Acceso</th></tr></thead><tbody>'+rows+'</tbody></table></div></section>'+(form?'<div style="margin-top:14px">'+form+'</div>':'');
}

/* ---------- render ---------- */
var root=document.getElementById('root');
function render(){root.innerHTML=S.role?shell():loginView();}
function renderMain(){var m=document.getElementById('main');if(m){m.innerHTML=pageHtml();}else render();}
function go(p){
  var ok=NAV.filter(function(n){return n.id===p&&n.roles.indexOf(S.role)>-1;}).length;
  if(!ok)p=S.role==='negocio'?'red':'panel';
  S.page=p;S.ui.sel=null;try{history.replaceState(null,'','#'+p);}catch(e){}
  render();window.scrollTo(0,0);
}
function login(){S.role=S.ui.profile;S.exp=900;S.flash='';var h=(location.hash||'').slice(1);S.page=S.role==='negocio'?'red':'panel';render();if(h&&NAV.some(function(n){return n.id===h;}))go(h);}
function logout(msg){S.role=null;S.flash=msg||'';S.draft=null;render();}

var A={
 pick:function(t){S.ui.profile=t.dataset.p;render();},
 go:function(t){go(t.dataset.p);},
 logout:function(){logout();},
 selp:function(t){S.ui.sel=S.ui.sel==t.dataset.id*1?null:t.dataset.id*1;document.getElementById('invBody').innerHTML=invBody();document.getElementById('drawer').innerHTML=drawer();},
 closesel:function(){S.ui.sel=null;document.getElementById('invBody').innerHTML=invBody();document.getElementById('drawer').innerHTML='';},
 fcat:function(t){S.ui.cat=t.dataset.v;renderMain();},
 fest:function(t){S.ui.est=t.dataset.v;renderMain();},
 movfor:function(t){S.ui.mov.pid=t.dataset.id*1;S.ui.movErr=null;S.ui.movOk=null;go('movimientos');},
 mtipo:function(t){S.ui.mov.tipo=t.dataset.v;S.ui.movErr=null;S.ui.movOk=null;renderMain();},
 pview:function(t){S.ui.predView=t.dataset.id*1;renderMain();},
 ptog:function(t){S.ui.predSel[t.dataset.id]=t.checked;renderMain();},
 mkdraft:function(){
  var g={};S.products.forEach(function(p){if(S.ui.predSel[p.id]&&suggested(p)>0){(g[p.sup]=g[p.sup]||[]).push({pid:p.id,qty:suggested(p)});}});
  S.draft=Object.keys(g).map(function(k){return {sup:k,lines:g[k]};});renderMain();
  var d=document.querySelector('[data-a="okdraft"]');if(d)d.scrollIntoView({block:'center'});
 },
 nodraft:function(){S.draft=null;renderMain();},
 okdraft:function(){
  var tt=draftTotals(),n=40+S.orders.length,sent=0;
  S.draft.forEach(function(g,i){if(tt[i]>0){S.orders.push({id:'OC-00'+(n+sent+1),sup:g.sup,total:tt[i],state:'Enviada al proveedor',t:new Date()});sent++;}});
  S.draft=null;S.ui.predSel=null;renderMain();toast(sent+' orden(es) enviada(s) a proveedores (simulado).');
 },
 rtab:function(t){S.ui.redTab=t.dataset.v;S.net.confirm=false;renderMain();},
 zone:function(t){var z=t.dataset.z*1;if(S.role==='negocio'&&z!==ownZone()){toast('Solo puedes ver el mapa de tu propia zona.');return;}S.ui.zone=z;renderMain();},
 revask:function(){S.net.confirm=true;renderMain();},
 revno:function(){S.net.confirm=false;renderMain();},
 revyes:function(){S.net.consent=false;S.net.confirm=false;renderMain();toast('Participación revocada. Se detuvo el envío de datos.');},
 rejoin:function(){S.net.consent=true;renderMain();toast('Participación reactivada.');},
 napr:function(t){S.negocios.forEach(function(n){if(n.id==t.dataset.id*1){n.state='Activo';n.days=0;}});renderMain();toast('Negocio aprobado y notificado (simulado).');},
 nrej:function(t){S.negocios=S.negocios.filter(function(n){return n.id!=t.dataset.id*1;});renderMain();toast('Solicitud rechazada.');},
 nsus:function(t){S.negocios.forEach(function(n){if(n.id==t.dataset.id*1){n.state=n.state==='Suspendido'?'Activo':'Suspendido';}});renderMain();},
 addcat:function(){toast('Producto agregado al borrador del catálogo (simulado).');},
 exp:function(){toast('Exportación simulada en el prototipo.');},
 utog:function(t){S.users.forEach(function(u){if(u.id==t.dataset.id*1)u.on=!u.on;});renderMain();},
 unew:function(){S.ui.newUser=!S.ui.newUser;renderMain();}
};
root.addEventListener('click',function(e){
  var t=e.target.closest('[data-a]');if(!t)return;
  if(t.tagName==='A')e.preventDefault();
  if(t.dataset.a==='ptog'){A.ptog(t);return;}
  if(A[t.dataset.a])A[t.dataset.a](t,e);
});
root.addEventListener('keydown',function(e){
  if(e.key!=='Enter'&&e.key!==' ')return;
  var t=e.target;if(t.matches&&t.matches('tr[data-a],g[data-a]')){e.preventDefault();A[t.dataset.a](t,e);}
});
root.addEventListener('input',function(e){
  var t=e.target,k=t.dataset.i;if(!k)return;
  if(k==='q'){S.ui.q=t.value;var b=document.getElementById('invBody');if(b)b.innerHTML=invBody();}
  else if(k==='mov.doc'||k==='mov.lote'||k==='mov.vence'||k==='mov.qty'){S.ui.mov[k.slice(4)]=t.value;}
  else if(k==='dq'){S.draft[t.dataset.g*1].lines[t.dataset.l*1].qty=t.value;var tt=draftTotals();tt.forEach(function(v,i){var el=document.getElementById('dt'+i);if(el)el.textContent=COP.format(v);});}
});
root.addEventListener('change',function(e){
  var t=e.target,k=t.dataset.i;if(!k)return;
  if(k==='mov.pid'){S.ui.mov.pid=t.value*1;S.ui.movErr=null;renderMain();}
  else if(k==='mov.motivo'){S.ui.mov.motivo=t.value;}
  else if(k==='mcat'){S.ui.mcat=t.value;renderMain();}
  else if(k==='period'){S.ui.period=t.value;renderMain();}
  else if(k==='urol'){S.users.forEach(function(u){if(u.id==t.dataset.id*1)u.rol=t.value;});toast('Permisos actualizados (simulado).');}
});
root.addEventListener('submit',function(e){
  e.preventDefault();var f=e.target.dataset.f;
  if(f==='login')login();
  else if(f==='mov')submitMov();
  else if(f==='user'){S.users.push({id:S.users.length+1,name:document.getElementById('un').value,mail:document.getElementById('um').value,rol:document.getElementById('ur').value,on:true});S.ui.newUser=false;renderMain();toast('Usuario creado (simulado).');}
});

/* sesión: cierre por inactividad (15 min) */
function fmt(s){var m=Math.floor(s/60),r=s%60;return (m<10?'0':'')+m+':'+(r<10?'0':'')+r;}
['pointerdown','keydown'].forEach(function(ev){document.addEventListener(ev,function(){S.exp=900;});});
setInterval(function(){
  if(!S.role)return;
  S.exp--;var el=document.getElementById('sess');if(el)el.textContent=fmt(Math.max(0,S.exp));
  if(S.exp<=0)logout('Tu sesión se cerró por 15 minutos de inactividad.');
},1000);

render();
})();
</script>

</body></html>
